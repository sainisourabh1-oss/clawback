name: Release

# Push a tag such as v2.0.0 (it must match clawback.__version__) to build the sdist and wheel, check them,
# attach them to a GitHub Release, and publish those same files to PyPI (trusted publishing, no API token).
# "Run workflow" with a tag publishes an existing GitHub Release's files to PyPI without rebuilding them
# (releases and v* tags are immutable, so this is how an already-released version reaches PyPI).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to PyPI, e.g. v2.0.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build and check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('clawback/__init__.py', encoding='utf-8').read()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match clawback.__version__ ${version}"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a fresh venv
        run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Clawback ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # Publishes exactly the files attached to the GitHub Release, so PyPI and GitHub always match.
  pypi-publish:
    name: publish to PyPI
    needs: github-release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.github-release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/clawback
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: ${TAG}"; exit 1
          fi
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir dist \
            --pattern "clawback-${TAG#v}-py3-none-any.whl" --pattern "clawback-${TAG#v}.tar.gz"
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2
          python -m pip install --quiet twine
          python -m twine check --strict dist/*
          sha256sum dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
