<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="__CSRF__">
<meta name="color-scheme" content="light dark">
<title>Clawback</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/icons.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="aurora" id="aurora" aria-hidden="true"><canvas id="aurora-c" width="1" height="1"></canvas></div>
<a class="skip" href="#main" data-i18n="nav.skip">Skip to content</a>
<header class="top">
  <div class="bar">
    <div class="brand">
      <img src="/static/logo.svg" width="28" height="28" alt="">
      <span class="name">Clawback</span>
    </div>
    <ol class="flow" id="flow" data-i18n-label="flow.label">
      <li><span data-i18n="flow.connect"></span></li>
      <li><span data-i18n="flow.scan"></span></li>
      <li><span data-i18n="flow.review"></span></li>
      <li><span data-i18n="flow.confirm"></span></li>
      <li><span data-i18n="flow.proof"></span></li>
    </ol>
    <div class="top-actions">
      <label class="acct" hidden><span class="sr" data-i18n="nav.account"></span><select id="account"></select></label>
      <button type="button" class="ghost icon-btn" id="add-source" hidden></button>
      <button type="button" class="ghost icon-btn" id="theme" aria-live="polite"></button>
      <button type="button" class="ghost icon-btn" id="open-settings"></button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section id="view"></section>
</main>
<footer class="foot"><span><span data-i18n="app.local"></span> · v__VERSION__</span></footer>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
