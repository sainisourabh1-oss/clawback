[build-system]
# setuptools >= 77 understands the SPDX `license = "MIT"` string (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clawback"
dynamic = ["version"]
description = "Clawback: claw back your inbox and your money. Local, privacy-first email cleanup: safe unsubscribe, spam-like sender blocking, paid-subscription finder and savings."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Clawback contributors" }]
keywords = ["email", "unsubscribe", "inbox-cleanup", "privacy", "local-first", "subscriptions", "newsletter", "spam",
            "gmail", "imap", "mbox", "takeout", "gdpr", "dpdp", "ccpa", "upi"]
# No "License ::" classifier: with the SPDX `license` field above, setuptools >= 77 rejects one (PEP 639).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Filters",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
test = ["pytest>=7.4", "trustme>=1.1"]

[project.scripts]
clawback = "clawback.cli:main"

[project.urls]
Homepage = "https://github.com/sainisourabh1-oss/clawback"
Source = "https://github.com/sainisourabh1-oss/clawback"
Issues = "https://github.com/sainisourabh1-oss/clawback/issues"
Changelog = "https://github.com/sainisourabh1-oss/clawback/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sainisourabh1-oss/clawback#readme"

[tool.setuptools.dynamic]
version = { attr = "clawback.__version__" }

[tool.setuptools.packages.find]
include = ["clawback*"]

[tool.setuptools.package-data]
clawback = ["data/*.json", "web/static/*.html", "web/static/*.js", "web/static/*.css", "web/static/*.svg", "web/static/*.ico", "web/static/i18n/*.json",
            "web/static/fonts/*.woff2", "web/static/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
